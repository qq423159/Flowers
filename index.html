<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Beautiful Girl 🌸</title>

<style>

body{
    margin:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(to top,#ffe4ef,#fff9fc);
    font-family:Georgia,serif;
}

.container{
    text-align:center;
}

h1{
    color:#d63384;
    margin-bottom:10px;
    opacity:0;
    animation:fadeIn 2s forwards;
}

p{
    color:#7d4b61;
    opacity:0;
    animation:fadeIn 2s forwards;
    animation-delay:1s;
}

svg{
    width:260px;
    margin-top:20px;
}

.stem{
    stroke:#3d9c4a;
    stroke-width:8;
    stroke-linecap:round;

    stroke-dasharray:220;
    stroke-dashoffset:220;

    animation:growStem 2s ease forwards;
}

.leaf{
    fill:#56b95f;

    transform-origin:center;

    transform:scale(0);

    animation:bloomLeaf .8s forwards;

    animation-delay:1.8s;
}

.petal{

    fill:#ff77aa;

    transform-origin:150px 70px;

    transform:scale(0);

    animation:bloomFlower .8s forwards;

    animation-delay:2.4s;

}

.center{

    fill:#ffd54f;

    transform-origin:150px 70px;

    transform:scale(0);

    animation:bloomFlower .6s forwards;

    animation-delay:2.8s;

}

@keyframes growStem{

    to{

        stroke-dashoffset:0;

    }

}

@keyframes bloomFlower{

    0%{

        transform:scale(0);

    }

    70%{

        transform:scale(1.15);

    }

    100%{

        transform:scale(1);

    }

}

@keyframes bloomLeaf{

    from{

        transform:scale(0);

    }

    to{

        transform:scale(1);

    }

}

@keyframes fadeIn{

    to{

        opacity:1;

    }

}

</style>

</head>

<body>

<div class="container">

<h1>🌸 Happy National Girlfriend's Day 🌸</h1>

<p>For the most beautiful flower in my life ❤️</p>

<svg viewBox="0 0 300 400">

<!-- Stem -->

<line class="stem"
      x1="150"
      y1="360"
      x2="150"
      y2="90"/>

<!-- Leaves -->

<ellipse class="leaf"
         cx="125"
         cy="220"
         rx="25"
         ry="12"
         transform="rotate(-30 125 220)"/>

<ellipse class="leaf"
         cx="175"
         cy="180"
         rx="25"
         ry="12"
         transform="rotate(30 175 180)"/>

<!-- Petals -->

<ellipse class="petal" cx="150" cy="45" rx="18" ry="42"/>

<ellipse class="petal"
         cx="150"
         cy="45"
         rx="18"
         ry="42"
         transform="rotate(60 150 70)"/>

<ellipse class="petal"
         cx="150"
         cy="45"
         rx="18"
         ry="42"
         transform="rotate(120 150 70)"/>

<ellipse class="petal"
         cx="150"
         cy="45"
         rx="18"
         ry="42"
         transform="rotate(180 150 70)"/>

<ellipse class="petal"
         cx="150"
         cy="45"
         rx="18"
         ry="42"
         transform="rotate(240 150 70)"/>

<ellipse class="petal"
         cx="150"
         cy="45"
         rx="18"
         ry="42"
         transform="rotate(300 150 70)"/>

<!-- Flower Center -->

<circle class="center"
        cx="150"
        cy="70"
        r="18"/>

</svg>

</div>

</body>
</html>

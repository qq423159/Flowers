<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Beautiful Girl 🌸</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(#b8e8ff,#ffe8f5);
    font-family:Georgia,serif;
}

canvas{
    display:block;
}

.message{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
    color:#d63384;
    text-shadow:0 0 10px white;
}

.message h1{
    margin:0;
    font-size:clamp(2rem,5vw,3.5rem);
}

.message p{
    margin-top:10px;
    font-size:clamp(1rem,2.5vw,1.4rem);
}

</style>
</head>

<body>

<div class="message">
<h1>🌸 Happy National Girlfriend's Day 🌸</h1>
<p>For the most beautiful flower in my life ❤️</p>
</div>

<canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

window.onresize=resize;
resize();

const flowers=[];

function makeFlower(){

    flowers.push({

        x:Math.random()*canvas.width,

        y:canvas.height-20-Math.random()*220,

        stem:0,

        target:50+Math.random()*80,

        petals:0,

        color:[
            "#ff6fa8",
            "#ffb347",
            "#ffd93d",
            "#b784ff",
            "#ff5c8a",
            "#ff8fab"
        ][Math.floor(Math.random()*6)]

    });

}

for(let i=0;i<80;i++){

    setTimeout(makeFlower,i*120);

}

function drawFlower(f){

    // stem

    ctx.strokeStyle="#3fa34d";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(f.x,canvas.height);

    ctx.lineTo(f.x,canvas.height-f.stem);

    ctx.stroke();

    if(f.stem<f.target){

        f.stem+=2;

        return;

    }

    if(f.petals<1){

        f.petals+=0.03;

    }

    const cy=canvas.height-f.target;

    // petals

    ctx.fillStyle=f.color;

    for(let i=0;i<8;i++){

        ctx.save();

        ctx.translate(f.x,cy);

        ctx.rotate(i*Math.PI/4);

        ctx.scale(f.petals,f.petals);

        ctx.beginPath();

        ctx.ellipse(0,-12,8,18,0,0,Math.PI*2);

        ctx.fill();

        ctx.restore();

    }

    // center

    ctx.beginPath();

    ctx.fillStyle="#ffd54f";

    ctx.arc(f.x,cy,7*f.petals,0,Math.PI*2);

    ctx.fill();

}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // grass

    ctx.fillStyle="#8fd67a";

    ctx.fillRect(0,canvas.height-70,canvas.width,70);

    flowers.forEach(drawFlower);

    requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>

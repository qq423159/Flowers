<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Beautiful Girl 🌸</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#ffd6e7,#fff5fa);
    font-family:Georgia,serif;
}

.container{
    text-align:center;
}

h1{
    color:#d63384;
    margin-bottom:10px;
    opacity:0;
    animation:fadeIn 2s forwards;
}

p{
    color:#6b2146;
    margin-bottom:30px;
    opacity:0;
    animation:fadeIn 2s forwards;
    animation-delay:1s;
}

.bouquet{
    position:relative;
    width:320px;
    height:320px;
    margin:auto;
}

.flower{
    position:absolute;
    font-size:60px;
    transform:scale(0);
    animation:bloom .8s forwards;
}

@keyframes bloom{
    from{
        transform:scale(0) rotate(-90deg);
        opacity:0;
    }
    to{
        transform:scale(1) rotate(0deg);
        opacity:1;
    }
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🌸 Happy National Girlfriend's Day 🌸</h1>

<p>Every flower in this bouquet is for you. ❤️</p>

<div class="bouquet" id="bouquet"></div>

</div>

<script>

const flowers=[
"🌹","🌹","🌹",
"🌷","🌷",
"🌸","🌸","🌸",
"🌼","🌼",
"🌻",
"🪻",
"🌺"
];

const positions=[
[140,210],
[90,180],
[190,180],
[55,135],
[225,135],
[95,90],
[185,90],
[140,60],
[45,215],
[235,215],
[140,130],
[80,250],
[200,250]
];

const bouquet=document.getElementById("bouquet");

flowers.forEach((emoji,index)=>{

    setTimeout(()=>{

        const f=document.createElement("div");

        f.className="flower";

        f.textContent=emoji;

        f.style.left=positions[index][0]+"px";

        f.style.top=positions[index][1]+"px";

        bouquet.appendChild(f);

    },index*250);

});

</script>

</body>
</html>

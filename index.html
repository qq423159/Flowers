<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For My Beautiful Girl 🌸</title>

  <style>
    :root{
      --bg1: #b8e8ff;
      --bg2: #ffe8f5;
      --title-color:#d63384;
    }

    html,body{
      margin:0;
      height:100%;
      width:100%;
      font-family: Georgia, serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      background: linear-gradient(var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* Title/message: always on top, not blocked by canvas.
       Ensure the heading fits in one line on narrow screens. */
    .message{
      position:fixed;
      left:0;
      right:0;
      top:env(safe-area-inset-top,12px);
      text-align:center;
      z-index:40;
      padding:8px 10px;
      pointer-events:auto;
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
      background: linear-gradient(rgba(255,255,255,0.0), rgba(255,255,255,0.02));
    }

    .message h1{
      margin:0;
      color:var(--title-color);
      text-shadow:0 0 8px rgba(255,255,255,.7);
      /* clamp so it becomes small enough on narrow phones; force single-line */
      font-size: clamp(1rem, 4.6vw, 1.6rem);
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .message p{
      margin:6px 0 0 0;
      color:#7d4b61;
      font-size: clamp(.78rem, 2.3vw, .98rem);
      text-shadow:0 0 6px rgba(255,255,255,.7);
    }

    /* Canvas behind message */
    canvas#c{
      position:fixed;
      inset:0;
      display:block;
      z-index:0;
      touch-action:none;
      background: transparent;
    }

    .bottom-space{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height: clamp(56px, 12vh, 120px);
      z-index:5;
      pointer-events:none;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="message" id="message">
    <h1>🌸 Happy National Girlfriend's Day 🌸</h1>
    <p>For the most beautiful flower in my life ❤️</p>
  </div>
<!-- Audio player (drop into your existing index.html) -->
<audio id="bg-audio" preload="metadata" loop playsinline autoplay>
  <!-- replace the src below with your file URL or path -->
  <source src="song.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<!-- Compact accessible controls (download removed) -->
<div id="audio-controls" aria-live="polite" style="position:fixed;left:12px;bottom:14px;z-index:60;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);border-radius:10px;padding:6px 8px;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <button id="audio-toggle" aria-label="Play music" title="Play / Pause" style="width:40px;height:40px;border-radius:8px;border:none;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <!-- simple play icon -->
    <svg id="audio-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 4v16l14-8L6 4z" fill="#d63384"></path>
    </svg>
  </button>

  <button id="audio-mute" aria-label="Mute" title="Mute" style="width:36px;height:36px;border-radius:8px;border:none;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5z" fill="#7d4b61"/></svg>
  </button>

  <input id="audio-volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume" title="Volume" style="width:110px;">
</div>

<script>
(function(){
  const audio = document.getElementById('bg-audio');
  const toggle = document.getElementById('audio-toggle');
  const icon = document.getElementById('audio-icon');
  const muteBtn = document.getElementById('audio-mute');
  const vol = document.getElementById('audio-volume');

  // Respect prefers-reduced-motion: do not autoplay
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ensure playsinline for mobile browsers
  audio.playsInline = true;
  audio.loop = true;
  audio.autoplay = true;

  // initial settings
  audio.volume = parseFloat(vol.value);
  audio.muted = false;

  // UI updater
  function updateUI(playing){
    icon.innerHTML = '';
    if (playing) {
      // pause icon
      icon.insertAdjacentHTML('beforeend','<path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="#d63384"/>');
      toggle.setAttribute('aria-label','Pause music');
      toggle.title = 'Pause';
    } else {
      // play icon
      icon.insertAdjacentHTML('beforeend','<path d="M6 4v16l14-8L6 4z" fill="#d63384"></path>');
      toggle.setAttribute('aria-label','Play music');
      toggle.title = 'Play';
    }
  }

  // Try to autoplay on load (best-effort). Many browsers block audible autoplay;
  // we attempt audible play, and if blocked, attempt a muted play and add a one-time
  // resume on first user interaction to unmute/play audibly.
  (async function tryAutoplay() {
    if (reducedMotion) { updateUI(false); return; }
    try {
      // first try audible autoplay
      await audio.play();
      updateUI(true);
      try { localStorage.setItem('flowers_music_playing','1'); } catch(e){}
    } catch (err) {
      // audible autoplay blocked by browser
      try {
        // attempt muted autoplay so playback is ready — user can unmute with a tap.
        audio.muted = true;
        await audio.play();
        updateUI(false); // show play icon because it's effectively muted
        // one-time resume/unmute on first interaction
        const resume = async () => {
          audio.muted = false;
          try {
            await audio.play();
            updateUI(true);
            try { localStorage.setItem('flowers_music_playing','1'); } catch(e){}
          } catch(e){}
          window.removeEventListener('pointerdown', resume);
        };
        window.addEventListener('pointerdown', resume, { once: true });
      } catch (e) {
        // couldn't even play muted; user gesture needed
        updateUI(false);
      }
    }
  })();

  // restore play state if user previously chose to play
  try {
    const wasPlaying = localStorage.getItem('flowers_music_playing') === '1';
    if (wasPlaying && !reducedMotion) {
      // try to resume (note: may still be blocked)
      audio.play().then(()=> updateUI(true)).catch(()=> updateUI(false));
    } else {
      updateUI(false);
    }
  } catch(e){ updateUI(false); }

  // toggle play/pause (user gesture)
  toggle.addEventListener('click', async () => {
    if (audio.paused) {
      try {
        await audio.play();
        updateUI(true);
        try { localStorage.setItem('flowers_music_playing','1'); } catch(e){}
      } catch (e) {
        console.warn('Playback failed', e);
        updateUI(false);
      }
    } else {
      audio.pause();
      updateUI(false);
      try { localStorage.setItem('flowers_music_playing','0'); } catch(e){}
    }
  });

  // mute toggle
  muteBtn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    muteBtn.style.opacity = audio.muted ? '0.6' : '1';
  });

  // volume slider
  vol.addEventListener('input', (e) => {
    audio.volume = parseFloat(e.target.value);
    audio.muted = audio.volume === 0;
  });

  // Keyboard accessibility: Space or Enter on focused toggle button
  toggle.addEventListener('keydown', (ev) => {
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); toggle.click(); }
  });

  // Pause audio when page hidden (save resources)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (!audio.paused) { audio.pause(); updateUI(false); }
    } else {
      try {
        if (localStorage.getItem('flowers_music_playing') === '1' && !reducedMotion) {
          audio.play().then(()=>updateUI(true)).catch(()=>updateUI(false));
        }
      } catch(e){}
    }
  });

  // expose for debugging
  window.__flowersAudio = audio;
})();
</script>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="bottom-space" aria-hidden="true"></div>

  <script>
    (function () {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      const DPR = Math.max(window.devicePixelRatio || 1, 1);
      const MIN_FLOWERS = 40;
      const MAX_FLOWERS = 220;
      const AREA_PER_FLOWER = 9000;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W = 0, H = 0, baseY = 0;
      let reservedTop = 0, groundHeight = 0;
      let flowers = [], butterflies = [], critters = [];
      let lastTime = 0;

      function rand(min, max) { return min + Math.random() * (max - min); }
      function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        const msg = document.getElementById('message');
        const r = msg.getBoundingClientRect();
        reservedTop = Math.ceil(r.bottom + 6);
        groundHeight = Math.max(56, Math.round(H * 0.12));
        baseY = H - groundHeight;

        const area = W * H;
        const desired = Math.round(area / AREA_PER_FLOWER);
        const target = Math.min(MAX_FLOWERS, Math.max(MIN_FLOWERS, desired));
        adjustFlowerCount(target);

        adjustButterflyCount(Math.max(3, Math.round(W / 240)));
        adjustCritterCount(Math.max(3, Math.round(W / 240)));
      }

      function adjustFlowerCount(target) {
        if (flowers.length > target) { flowers.length = target; return; }
        let attempts = 0;
        while (flowers.length < target && attempts < target * 6) {
          const f = makeFlower();
          if (!isTooCloseToOthers(f, 0.85)) flowers.push(f);
          else if (Math.random() < 0.05) flowers.push(f);
          attempts++;
        }
      }

      function adjustButterflyCount(n) {
        while (butterflies.length < n) butterflies.push(makeButterfly());
        while (butterflies.length > n) butterflies.pop();
      }

      function adjustCritterCount(n) {
        while (critters.length < n) critters.push(makeCritter());
        while (critters.length > n) critters.pop();
      }

      function isTooCloseToOthers(candidate, overlapFactor = 1.0) {
        const minDist = (candidate.petalLength + 20) * overlapFactor;
        for (let f of flowers) {
          const dx = f.x - candidate.x;
          const dy = (f.baseY - f.targetStem) - candidate.cy;
          const d = Math.hypot(dx, dy);
          if (d < minDist + (f.petalLength || 20)) return true;
        }
        return false;
      }

      function makeFlower(x, y) {
        const marginTop = reservedTop + 8;
        const minY = marginTop + 40;
        const maxY = baseY - 30;
        const cx = (typeof x === 'number') ? x : rand(30, W - 30);
        const cy = (typeof y === 'number') ? y : rand(Math.max(minY, maxY - 180), maxY);
        const maxStem = baseY - cy;
        const targetStem = Math.max(14, Math.min(maxStem, rand(26, maxStem)));
        const petalCount = randInt(4, 10);
        const petalLength = rand(12, 36);
        const petalWidth = rand(6, 20);
        const colorPalette = [
          '#ff6fa8', '#ffb347', '#ffd93d', '#b784ff', '#ff5c8a', '#ff8fab',
          '#f48fb1', '#f06292', '#ff9e80', '#ffd54f'
        ];
        const color = colorPalette[randInt(0, colorPalette.length - 1)];
        const species = ['ellipse','teardrop','rounded'][randInt(0,2)];
        const rotation = rand(0, Math.PI * 2);
        const sway = rand(0.001, 0.008);
        const bloomDelay = rand(0, 1600);
        return {
          x: cx,
          baseY: baseY,
          cy: cy,
          stemProgress: reducedMotion ? targetStem : 0,
          targetStem: targetStem,
          petalProgress: reducedMotion ? 1 : 0,
          petalCount,
          petalLength,
          petalWidth,
          color,
          species,
          rotation,
          sway,
          bloomDelay,
          createdAt: performance.now(),
          vx: 0
        };
      }

      function makeButterfly() {
        const x = rand(40, W - 40);
        const y = rand(reservedTop + 60, Math.max(reservedTop + 140, baseY - 140));
        return {
          x, y,
          baseY: y,
          vx: rand(-0.4, 0.4),
          vy: rand(-0.2, 0.2),
          wing: rand(0, Math.PI * 2),
          wingSpeed: rand(0.1, 0.26),
          color: ['#ff6fa8','#ffd54f','#b784ff','#ff9e80'][randInt(0,3)],
          size: rand(8, 18),
          wobble: rand(0.4,1.6),
          createdAt: performance.now()
        };
      }

      // NEW: more detailed critters
      function makeCritter(spec) {
        const species = spec || ['cat','dog','bunny'][randInt(0,2)];
        const laneY = baseY - rand(18, 28);
        const dir = Math.random() > 0.5 ? 1 : -1;
        const speed = rand(0.6, 1.6) * (Math.random() < 0.6 ? 1 : 1.4);
        const size = rand(10, 22);
        // color palettes per species
        const palettes = {
          cat: ['#cfa6b3','#d0c0a6','#bfbcbc','#e6b7c7', '#a18aa6'],
          dog: ['#cfa57d','#b4845a','#e6c7a3','#b88f6a'],
          bunny: ['#f8f3f2','#efe7e4','#eae1dd']
        };
        const color = palettes[species][randInt(0, palettes[species].length - 1)];
        return {
          species,
          x: dir === 1 ? rand(-80, W + 80) : rand(-80, W + 80),
          y: laneY + rand(-6, 6),
          dir,
          speed,
          size,
          legPhase: rand(0, Math.PI * 2),
          createdAt: performance.now(),
          vx: 0,
          color
        };
      }

      // Drawing helpers for flowers & butterflies (unchanged)
      function drawStem(f) {
        const x = f.x;
        const bottom = f.baseY;
        const topY = bottom - f.stemProgress;
        ctx.beginPath();
        ctx.lineWidth = Math.max(2, Math.round(f.petalWidth * 0.25));
        ctx.strokeStyle = '#3fa34d';
        ctx.lineCap = 'round';
        ctx.moveTo(x, bottom);
        const cpX = x + Math.sin((f.x + f.createdAt) * 0.001) * 8;
        const cpY = bottom - f.stemProgress * 0.5;
        ctx.quadraticCurveTo(cpX, cpY, x, topY);
        ctx.stroke();
      }

      function drawPetalShape(species, px, py, len, wid, angle, progress, color) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle);
        ctx.scale(progress, progress);
        ctx.fillStyle = color;
        if (species === 'ellipse') {
          ctx.beginPath();
          ctx.ellipse(0, -len * 0.45, wid, len, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (species === 'teardrop') {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(wid * 0.6, -len * 0.25, wid * 0.6, -len * 0.75, 0, -len);
          ctx.bezierCurveTo(-wid * 0.6, -len * 0.75, -wid * 0.6, -len * 0.25, 0, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(0, -len);
          ctx.quadraticCurveTo(wid, -len * 0.5, 0, 0);
          ctx.quadraticCurveTo(-wid, -len * 0.5, 0, -len);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFlower(f, time) {
        const age = time - f.createdAt;
        if (!reducedMotion) {
          if (age > f.bloomDelay) {
            if (f.stemProgress < f.targetStem) {
              f.stemProgress += Math.max(0.6, f.targetStem * 0.02);
              if (f.stemProgress > f.targetStem) f.stemProgress = f.targetStem;
            } else {
              if (f.petalProgress < 1) {
                f.petalProgress += 0.02 + Math.random() * 0.02;
                if (f.petalProgress > 1) f.petalProgress = 1;
              }
            }
          }
        }
        // gentle repulsion
        const repulsionRange = Math.max(30, f.petalLength * 1.6);
        let fx = 0;
        for (let other of flowers) {
          if (other === f) continue;
          const dy = (other.baseY - other.targetStem) - (f.baseY - f.targetStem);
          const dx = other.x - f.x;
          const d = Math.hypot(dx, dy);
          if (d > 0 && d < repulsionRange) {
            const push = (repulsionRange - d) / repulsionRange;
            fx += -Math.sign(dx) * push * 0.6;
          }
        }
        f.vx = (f.vx * 0.85) + fx * 0.2;
        f.vx = Math.max(-1.6, Math.min(1.6, f.vx));
        f.x += f.vx;
        f.x = Math.max(20, Math.min(W - 20, f.x));

        drawStem(f);
        const currentCenterY = f.baseY - f.stemProgress;
        const swayOffset = Math.sin((time * f.sway) + f.x * 0.01) * 4 * (1 - f.petalProgress * 0.5);
        const cx = f.x + swayOffset;
        const rot = f.rotation + (f.petalProgress * 0.12);

        if (f.petalProgress > 0) {
          for (let i = 0; i < f.petalCount; i++) {
            const angle = rot + (i * (Math.PI * 2 / f.petalCount));
            drawPetalShape(f.species, cx, currentCenterY, f.petalLength, f.petalWidth, angle, f.petalProgress, f.color);
          }
          ctx.beginPath();
          ctx.fillStyle = '#ffd54f';
          ctx.arc(cx, currentCenterY, Math.max(4, 8 * f.petalProgress), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawGrass() {
        const grad = ctx.createLinearGradient(0, baseY - 80, 0, H);
        grad.addColorStop(0, '#9fe784');
        grad.addColorStop(1, '#6dbb5d');
        ctx.fillStyle = grad;
        ctx.fillRect(0, baseY, W, H - baseY);
      }

      // Butterflies (unchanged)
      function drawButterfly(b, time) {
        b.wing += b.wingSpeed;
        b.vx += Math.sin(time * 0.0006 + b.createdAt) * 0.002;
        b.vy += Math.cos(time * 0.0009 + b.createdAt) * 0.002;
        b.vx = Math.max(-1.6, Math.min(1.6, b.vx));
        b.vy = Math.max(-1.2, Math.min(1.2, b.vy));
        b.x += (b.vx + Math.sin(time * 0.0008 + b.x * 0.01) * 0.3);
        b.y += b.vy + Math.sin(time * 0.002 + b.y * 0.01) * 0.6;
        const minY = reservedTop + 20;
        if (b.y < minY) b.y = minY + Math.abs(b.vy) + 4;
        if (b.x < -40) b.x = W + 40;
        if (b.x > W + 40) b.x = -40;
        if (b.y < reservedTop + 10) b.y = reservedTop + 10;
        if (b.y > baseY - 20) b.y = baseY - 20;

        ctx.save();
        ctx.translate(b.x, b.y);
        const wingAngle = Math.sin(b.wing) * 0.9;
        const wingFlap = 1 + Math.sin(b.wing * b.wingSpeed * 6) * 0.15;
        // left wing
        ctx.save();
        ctx.rotate(-0.4 + wingAngle * 0.35);
        ctx.scale(wingFlap, 1);
        ctx.beginPath();
        ctx.fillStyle = b.color;
        ctx.ellipse(-b.size * 0.6, 0, b.size * 0.9, b.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // right wing
        ctx.save();
        ctx.rotate(0.4 - wingAngle * 0.35);
        ctx.scale(wingFlap, 1);
        ctx.beginPath();
        ctx.fillStyle = lighten(b.color, 0.12);
        ctx.ellipse(b.size * 0.6, 0, b.size * 0.9, b.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // body
        ctx.beginPath();
        ctx.fillStyle = '#4b3b3b';
        ctx.ellipse(0, 0, b.size * 0.18, b.size * 0.8, Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        // antennae
        ctx.strokeStyle = '#3b2b2b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-2, -b.size * 0.8);
        ctx.quadraticCurveTo(-6, -b.size * 1.6, -10, -b.size * 1.8);
        ctx.moveTo(2, -b.size * 0.8);
        ctx.quadraticCurveTo(6, -b.size * 1.6, 10, -b.size * 1.8);
        ctx.stroke();
        ctx.restore();
      }

      function lighten(hex, amt) {
        const col = hex.replace('#','');
        const num = parseInt(col,16);
        let r = (num >> 16) + Math.round(255 * amt);
        let g = ((num >> 8) & 0x00FF) + Math.round(255 * amt);
        let b = (num & 0x0000FF) + Math.round(255 * amt);
        r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }

      // NEW: improved critter drawing for realistic silhouettes
      function drawCritter(c, time) {
        // movement + avoidance
        c.legPhase += 0.18 + c.speed * 0.02;
        let fx = 0;
        for (let other of critters) {
          if (other === c) continue;
          const dx = other.x - c.x;
          const dy = other.y - c.y;
          const d = Math.hypot(dx, dy);
          if (d > 0 && d < 34) {
            fx += -Math.sign(dx) * (34 - d) * 0.02;
          }
        }
        c.vx = (c.vx || 0) * 0.9 + (c.dir * c.speed + fx) * 0.2;
        c.x += c.vx;

        // bounce edges to keep them in view
        if (c.x < -60) { c.x = -60; c.dir = 1; c.vx *= -0.6; }
        if (c.x > W + 60) { c.x = W + 60; c.dir = -1; c.vx *= -0.6; }

        // vertical bob for running gait
        const bob = Math.sin(c.legPhase * 0.9) * (c.size * 0.06);
        const minY = baseY - 30;
        const maxY = baseY - 8;
        c.y = Math.max(minY, Math.min(maxY, c.y + bob * 0.1));

        // draw critter with a clear facing direction
        ctx.save();
        ctx.translate(c.x, c.y);
        if (c.dir < 0) ctx.scale(-1, 1); // face the direction of travel

        // define body parameters
        const S = c.size;
        const bodyW = S * 1.6;
        const bodyH = S * 0.8;
        const headX = S * 0.9;
        const headY = -S * 0.18;

        // torso with a subtle gradient for depth
        const tg = ctx.createLinearGradient(-bodyW, -bodyH, bodyW, bodyH);
        tg.addColorStop(0, lighten(c.color, -0.04));
        tg.addColorStop(1, c.color);
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.ellipse(0, 0, bodyW, bodyH, 0, 0, Math.PI * 2);
        ctx.fill();

        // shadow under body
        ctx.beginPath();
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.ellipse(0, bodyH * 0.5 + 2, bodyW * 0.7, bodyH * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();

        // head
        ctx.save();
        ctx.translate(headX, headY);
        ctx.beginPath();
        ctx.fillStyle = '#fff';
        ctx.ellipse(0, 0, S * 0.6, S * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();

        // face base color (slightly darker)
        ctx.beginPath();
        ctx.fillStyle = lighten(c.color, -0.06);
        ctx.ellipse(0, 0, S * 0.56, S * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // species-specific ears / face details
        if (c.species === 'bunny') {
          // long ears
          ctx.fillStyle = lighten(c.color, -0.06);
          ctx.beginPath();
          ctx.ellipse(-S * 0.25, -S * 1.05, S * 0.22, S * 0.72, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(S * 0.25, -S * 1.05, S * 0.22, S * 0.72, 0.2, 0, Math.PI * 2);
          ctx.fill();
          // inner ear
          ctx.fillStyle = '#f6d6df';
          ctx.beginPath();
          ctx.ellipse(-S * 0.25, -S * 1.0, S * 0.12, S * 0.5, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(S * 0.25, -S * 1.0, S * 0.12, S * 0.5, 0.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (c.species === 'cat') {
          // triangular ears
          ctx.fillStyle = lighten(c.color, -0.06);
          ctx.beginPath();
          ctx.moveTo(-S * 0.35, -S * 0.6);
          ctx.lineTo(-S * 0.55, -S * 1.0);
          ctx.lineTo(-S * 0.1, -S * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(S * 0.35, -S * 0.6);
          ctx.lineTo(S * 0.55, -S * 1.0);
          ctx.lineTo(S * 0.1, -S * 0.7);
          ctx.closePath();
          ctx.fill();
          // inner ear
          ctx.fillStyle = '#f6d6df';
          ctx.beginPath();
          ctx.moveTo(-S * 0.38, -S * 0.68);
          ctx.lineTo(-S * 0.48, -S * 0.9);
          ctx.lineTo(-S * 0.18, -S * 0.72);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(S * 0.38, -S * 0.68);
          ctx.lineTo(S * 0.48, -S * 0.9);
          ctx.lineTo(S * 0.18, -S * 0.72);
          ctx.closePath();
          ctx.fill();
        } else { // dog
          // floppy ears
          ctx.fillStyle = '#7b5a4a';
          ctx.beginPath();
          ctx.ellipse(-S * 0.4, -S * 0.35, S * 0.22, S * 0.48, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(S * 0.35, -S * 0.35, S * 0.22, S * 0.48, 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // eyes
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(-S * 0.05, -S * 0.05, S * 0.08, S * 0.10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(S * 0.22, -S * 0.05, S * 0.08, S * 0.10, 0, 0, Math.PI * 2);
        ctx.fill();

        // eye highlights
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(-S * 0.08, -S * 0.07, S * 0.02, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(S * 0.20, -S * 0.07, S * 0.02, 0, Math.PI * 2); ctx.fill();

        // nose
        ctx.fillStyle = '#8b5a57';
        ctx.beginPath();
        ctx.moveTo(S * 0.07, S * 0.02);
        ctx.lineTo(S * -0.02, S * 0.12);
        ctx.lineTo(S * -0.1, S * 0.02);
        ctx.closePath();
        ctx.fill();

        // whiskers for cat and bunny
        if (c.species === 'cat' || c.species === 'bunny') {
          ctx.strokeStyle = 'rgba(80,80,80,0.7)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-S * 0.15, S * 0.02);
          ctx.lineTo(-S * 0.45, S * 0.00);
          ctx.moveTo(-S * 0.15, S * 0.06);
          ctx.lineTo(-S * 0.45, S * 0.08);
          ctx.moveTo(S * 0.15, S * 0.02);
          ctx.lineTo(S * 0.45, S * 0.00);
          ctx.moveTo(S * 0.15, S * 0.06);
          ctx.lineTo(S * 0.45, S * 0.08);
          ctx.stroke();
        }

        ctx.restore(); // end head

        // tail / markings
        if (c.species === 'bunny') {
          // cotton tail
          ctx.beginPath();
          ctx.fillStyle = '#fff';
          ctx.arc(-bodyW * 0.9, -S * 0.05, S * 0.36, 0, Math.PI * 2);
          ctx.fill();
        } else if (c.species === 'cat') {
          // curved tail
          ctx.beginPath();
          ctx.strokeStyle = lighten(c.color, -0.02);
          ctx.lineWidth = Math.max(3, S * 0.12);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-bodyW * 0.5, -S * 0.05);
          ctx.quadraticCurveTo(-bodyW * 1.0, -S * 1.2, -bodyW * 0.2, -S * 1.6);
          ctx.stroke();
        } else {
          // dog wagging tail
          ctx.save();
          ctx.translate(-bodyW * 0.6, -S * 0.1);
          ctx.rotate(Math.sin(time * 0.01 + c.createdAt) * 0.6);
          ctx.fillStyle = '#7b5a4a';
          ctx.beginPath();
          ctx.ellipse(0, 0, S * 0.26, S * 0.12, 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // legs with running animation (front/back)
        const legStretch = Math.sin(c.legPhase) * S * 0.24;
        ctx.strokeStyle = '#6b4f42';
        ctx.lineWidth = Math.max(1, S * 0.09);
        ctx.lineCap = 'round';
        // front left
        ctx.beginPath();
        ctx.moveTo(S * 0.5, S * 0.45);
        ctx.lineTo(S * 0.5, S * 0.45 + legStretch);
        ctx.stroke();
        // front right (alternating)
        ctx.beginPath();
        ctx.moveTo(S * 0.2, S * 0.45);
        ctx.lineTo(S * 0.2, S * 0.45 - legStretch);
        ctx.stroke();
        // back left
        ctx.beginPath();
        ctx.moveTo(-S * 0.2, S * 0.45);
        ctx.lineTo(-S * 0.2, S * 0.45 - legStretch);
        ctx.stroke();
        // back right
        ctx.beginPath();
        ctx.moveTo(-S * 0.5, S * 0.45);
        ctx.lineTo(-S * 0.5, S * 0.45 + legStretch);
        ctx.stroke();

        // small decorative markings (spots/stripes)
        if (c.species === 'dog') {
          ctx.fillStyle = lighten(c.color, -0.12);
          ctx.beginPath();
          ctx.arc(-S * 0.2, -S * 0.05, S * 0.28, 0, Math.PI * 2);
          ctx.fill();
        } else if (c.species === 'cat') {
          ctx.fillStyle = lighten(c.color, -0.08);
          ctx.beginPath();
          ctx.ellipse(0, -S * 0.05, S * 0.35, S * 0.12, 0.3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore(); // restore global state
      }

      // Animation loop
      function animate(ts) {
        if (!lastTime) lastTime = ts;
        const delta = ts - lastTime;
        lastTime = ts;

        ctx.clearRect(0, 0, W, H);

        // background + ground
        drawGrass();

        // draw flowers
        for (let i = 0; i < flowers.length; i++) {
          drawFlower(flowers[i], ts);
        }

        // critters on bottom (draw above flowers)
        for (let c of critters) drawCritter(c, ts);

        // butterflies on top of critters/flowers but behind title
        for (let b of butterflies) drawButterfly(b, ts);

        // safety trim
        if (flowers.length > MAX_FLOWERS) flowers.splice(0, flowers.length - MAX_FLOWERS);

        requestAnimationFrame(animate);
      }

      // Pointer to plant flower (tap/click)
      function onPointer(e) {
        const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
        if (clientY <= reservedTop + 12) return;
        const f = makeFlower(clientX, clientY);
        if (!isTooCloseToOthers(f, 0.85)) {
          flowers.push(f);
        } else {
          let tries = 0;
          while (isTooCloseToOthers(f, 0.85) && tries < 8) {
            f.x = Math.max(30, Math.min(W - 30, f.x + rand(-36, 36)));
            tries++;
          }
          flowers.push(f);
        }
        if (flowers.length > MAX_FLOWERS) flowers.shift();
      }

      // Seed and init
      function init() {
        resize();
        seedInitial();
        const now = performance.now();
        flowers.forEach(f => f.createdAt = now - Math.random() * 1200);
        window.addEventListener('resize', resize, { passive: true });
        window.addEventListener('pointerdown', function(ev) {
          const target = ev.target;
          if (target.closest && target.closest('.message')) return;
          onPointer(ev);
        }, { passive: true });
        requestAnimationFrame(animate);
      }

      function seedInitial() {
        flowers = [];
        butterflies = [];
        critters = [];
        const area = W * H;
        const desired = Math.round(area / AREA_PER_FLOWER);
        const target = Math.min(MAX_FLOWERS, Math.max(MIN_FLOWERS, desired));

        // scatter flowers with spacing
        let tries = 0;
        while (flowers.length < target && tries < target * 10) {
          const x = rand(30, W - 30);
          const y = rand(reservedTop + 40, baseY - 40);
          const f = makeFlower(x, y);
          let accept = !isTooCloseToOthers(f, 0.9);
          let shiftTries = 0;
          while (!accept && shiftTries < 6) {
            f.x = Math.max(30, Math.min(W - 30, f.x + rand(-40,40)));
            f.cy = Math.max(reservedTop + 40, Math.min(baseY - 30, f.cy + rand(-16, 16)));
            accept = !isTooCloseToOthers(f, 0.9);
            shiftTries++;
          }
          if (accept || Math.random() < 0.04) flowers.push(f);
          tries++;
        }

        // a few larger focal flowers
        for (let i = 0; i < Math.min(8, Math.round(W/160)); i++) {
          const x = rand(60, W - 60);
          const y = rand(baseY - 160, baseY - 40);
          const big = makeFlower(x, y);
          big.petalLength *= rand(1.3, 1.9);
          big.petalWidth *= rand(1.1, 1.5);
          big.petalCount = randInt(5, 9);
          big.color = ['#ff6fa8', '#b784ff', '#ff9e80'][randInt(0,2)];
          big.createdAt = performance.now() - rand(0, 1200);
          if (!isTooCloseToOthers(big, 0.9)) flowers.push(big);
        }

        // butterflies
        const bfCount = Math.max(3, Math.round(W / 240));
        for (let i = 0; i < bfCount; i++) butterflies.push(makeButterfly());

        // critters: spawn a mix of cats/dogs/bunnies in lanes along bottom
        const crCount = Math.max(3, Math.round(W / 240));
        for (let i = 0; i < crCount; i++) {
          critters.push(makeCritter());
        }
      }

      init();

      // dev helper
      window.__flowerRespawn = function() { resize(); seedInitial(); };

    })();
  </script>
</body>
</html>

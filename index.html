<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A little animated flower for someone special — lightweight, accessible and responsive." />
  <title>For My Beautiful Girl 🌸</title>
  <!-- Optional: add a favicon file in the repo and point to it here -->
  <!-- <link rel="icon" href="favicon.png"> -->

  <style>
    /* Layout */
    :root{
      --pink:#d63384;
      --text:#7d4b61;
      --background: linear-gradient(to top,#ffe4ef,#fff9fc);
      --stem:#3d9c4a;
      --leaf:#56b95f;
      --petal:#ff77aa;
      --center:#ffd54f;
    }

    html,body{
      margin:0;
      min-height:100vh; /* avoid clipping on short viewports */
      display:flex;
      justify-content:center;
      align-items:center;
      background:var(--background);
      font-family: Georgia, serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{
      text-align:center;
      padding:24px;
      box-sizing:border-box;
    }

    h1{
      color:var(--pink);
      margin:0 0 8px 0;
      opacity:0;
      animation:fadeIn 700ms ease forwards;
      /* responsive size */
      font-size: clamp(1.25rem, 4vw, 1.75rem);
    }

    p{
      color:var(--text);
      margin:0;
      opacity:0;
      animation:fadeIn 700ms ease forwards;
      animation-delay:160ms;
      font-size: clamp(.9rem, 2.5vw, 1rem);
    }

    svg{
      width:260px;
      height:auto;
      margin-top:20px;
      display:block;
    }

    /* Animation & SVG helpers */
    .stem{
      stroke:var(--stem);
      stroke-width:8;
      stroke-linecap:round;
      /* dash settings will be overwritten to exact length via JS */
      stroke-dasharray:220;
      stroke-dashoffset:220;
      animation:growStem 900ms ease forwards;
      animation-delay:700ms;
    }

    /* Use transform-box for reliable SVG transforms */
    .leaf, .petal, .center {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transform: scale(0);
    }

    .leaf{
      fill:var(--leaf);
      animation:bloomLeaf 500ms cubic-bezier(.2,.9,.25,1) forwards;
      /* leaves appear slightly earlier than petals */
      animation-delay:1100ms;
    }

    .petal{
      fill:var(--petal);
      animation:bloomFlower 600ms cubic-bezier(.2,.9,.25,1) forwards;
      /* default delay for petals; individual petals below override to stagger */
      animation-delay:1400ms;
    }

    .petal.delay-1{ animation-delay:1400ms; }
    .petal.delay-2{ animation-delay:1520ms; }
    .petal.delay-3{ animation-delay:1640ms; }
    .petal.delay-4{ animation-delay:1760ms; }
    .petal.delay-5{ animation-delay:1880ms; }
    .petal.delay-6{ animation-delay:2000ms; }

    .center{
      fill:var(--center);
      animation:bloomFlower 420ms cubic-bezier(.2,.9,.25,1) forwards;
      animation-delay:2100ms;
    }

    @keyframes growStem{
      to{ stroke-dashoffset:0; }
    }

    @keyframes bloomFlower{
      0%{ transform: scale(0); }
      70%{ transform: scale(1.12); }
      100%{ transform: scale(1); }
    }

    @keyframes bloomLeaf{
      from{ transform: scale(0); }
      to{ transform: scale(1); }
    }

    @keyframes fadeIn{
      to{ opacity:1; }
    }

    /* Respect user preference for reduced motion */
    @media (prefers-reduced-motion: reduce){
      * { animation: none !important; transition: none !important; }
      .stem { stroke-dashoffset:0 !important; }
      h1, p { opacity:1 !important; }
      .leaf, .petal, .center { transform: none !important; }
    }

    /* Small screens: scale down SVG slightly */
    @media (max-width:360px){
      svg{ width:200px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌸 Happy National Girlfriend's Day 🌸</h1>
    <p>For the most beautiful flower in my life ❤️</p>

    <!-- Accessible SVG: role + labelled title/desc -->
    <svg viewBox="0 0 300 400" role="img" aria-labelledby="flowerTitle flowerDesc" xmlns="http://www.w3.org/2000/svg">
      <title id="flowerTitle">Pink flower growing from a green stem</title>
      <desc id="flowerDesc">An animated flower: the stem grows, leaves open, petals bloom and a yellow center appears.</desc>

      <!-- Stem (line length will be set by script so animation is exact) -->
      <line class="stem" x1="150" y1="360" x2="150" y2="90" />

      <!-- Leaves -->
      <ellipse class="leaf" cx="125" cy="220" rx="25" ry="12" transform="rotate(-30 125 220)" />
      <ellipse class="leaf" cx="175" cy="180" rx="25" ry="12" transform="rotate(30 175 180)" />

      <!-- Petals (each has a small stagger via extra class) -->
      <ellipse class="petal delay-1" cx="150" cy="45" rx="18" ry="42" />
      <ellipse class="petal delay-2" cx="150" cy="45" rx="18" ry="42" transform="rotate(60 150 70)" />
      <ellipse class="petal delay-3" cx="150" cy="45" rx="18" ry="42" transform="rotate(120 150 70)" />
      <ellipse class="petal delay-4" cx="150" cy="45" rx="18" ry="42" transform="rotate(180 150 70)" />
      <ellipse class="petal delay-5" cx="150" cy="45" rx="18" ry="42" transform="rotate(240 150 70)" />
      <ellipse class="petal delay-6" cx="150" cy="45" rx="18" ry="42" transform="rotate(300 150 70)" />

      <!-- Flower Center -->
      <circle class="center" cx="150" cy="70" r="18" />
    </svg>
  </div>

  <script>
    // Improve the stem animation by using the exact path length,
    // so the grow animation looks correct at any scale.
    document.addEventListener('DOMContentLoaded', function () {
      var stem = document.querySelector('.stem');
      try {
        if (stem && typeof stem.getTotalLength === 'function') {
          var len = stem.getTotalLength();
          stem.style.strokeDasharray = len;
          stem.style.strokeDashoffset = len;
        }
      } catch (e) {
        // fallback: do nothing; the CSS defaults still work
        console.warn('Stem length measurement failed', e);
      }
    });
  </script>
</body>
</html>
